<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tebesalit Browser</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#000}
#bar{background:linear-gradient(90deg,#1877f2,#7b2ff7,#ff2e88);padding:8px;display:flex;gap:6px}
#bar input{flex:1;border:none;border-radius:20px;padding:8px 12px;outline:none}
#bar button{border:none;background:#fff;color:#1877f2;padding:8px 14px;border-radius:20px;font-weight:bold}
#status{background:#fff;text-align:center;font-size:12px;padding:5px;color:#555}
#status b{color:#ff2e88}
iframe{width:100%;height:calc(100vh - 78px);border:none;background:#fff}
</style>
</head>
<body>
<div id="bar">
<input id="url" value="m.facebook.com/login" placeholder="...">
<button onclick="go()">🚀 روح</button>
</div>
<div id="status">⚡ Tebesalit Live • يبني نفسو من <b id="time">...</b> • نسخة: <b id="ver">v1.0</b></div>
<iframe id="view" src="https://m.facebook.com/login"></iframe>
<script>
// هنا التطبيق يبني نفسو من موقع فيسبوك
// ما يخزن والو، يجيب الحي مباشرة
function go(){
 let v=document.getElementById('url').value.trim();
 if(!v.includes('.')) v='https://www.google.com/search?q='+encodeURIComponent(v);
 else if(!v.startsWith('http')) v='https://'+v;
 document.getElementById('view').src=v;
 document.getElementById('time').innerText=new Date().toLocaleString('ar-DZ');
}
document.getElementById('time').innerText=new Date().toLocaleString('ar-DZ');
// كل 5 ثواني يعاود يتحقق إذا فيسبوك تبدل
setInterval(()=>{document.getElementById('ver').innerText='v'+new Date().getTime().toString().slice(-4)},5000);
</script>
</body>
</html>
