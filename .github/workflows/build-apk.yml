name: Build Tebesalit APK Simple
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Accept Licenses and Build
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          mkdir -p $ANDROID_HOME/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01f6f2f5230e67b8c7a" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "24333f8a63b6825a656882fa2f2492895e0e7a" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          gradle assembleDebug --stacktrace
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: tebesalit-app
          path: app/build/outputs/apk/debug/app-debug.apk
